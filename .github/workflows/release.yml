name: Release

# monorepo（ADR 0005）：一个仓、四条分发渠道。tag 前缀即包名，
# 一个提交可携带多个 tag，每个 tag 只触发自己那条链路，组件版本互不牵制。
#
#   agenote-v0.3.0        → PyPI + GitHub Release
#   agenote-el-v0.1.0     → ELPA 格式 tar + GitHub Release
#   dsh-agenote-v0.2.0    → npm + GitHub Release
#   agenote-pi-v0.1.0     → tar.gz + GitHub Release
#   agenote-zcode-v0.1.0  → tar.gz + GitHub Release
#   agenote-hermes-v0.1.0 → tar.gz + GitHub Release
#   agenote-skills-v0.1.0 → tar.gz + GitHub Release
#
# ⚠️ 历史遗留的 `v*` tag（v0.1.5 … v0.2.0.2，远端共 12 个）仍有效可引用，
#    但**新发版一律用 `<component>-v*`**。
on:
  push:
    tags:
      - "agenote-v*"
      - "agenote-el-v*"
      - "dsh-agenote-v*"
      - "agenote-pi-v*"
      - "agenote-zcode-v*"
      - "agenote-hermes-v*"
      - "agenote-skills-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "回填的 tag（须已存在于远端，形如 <component>-v<version>）"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # ── 1. 判定组件 + 构建产物 ─────────────────────────────────
  build:
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.sel.outputs.component }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          # 完整历史，用于构建 CHANGELOG 段落与 git ls-files
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          # 无依赖安装时 post-job 的 cache prune 会因缓存目录不存在而挂掉
          # 整个 job（agenote-skills 这类纯打包组件必踩），release 构建
          # 不需要依赖缓存
          enable-cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # tag 前缀即包名。这一步是唯一的映射点——新增组件只改
      # tools/release/build.py 的 COMPONENTS，本 job 无需改动。
      - name: 由 tag 前缀判定组件
        id: sel
        run: |
          set -euo pipefail
          for c in $(python3 tools/release/build.py --list | awk '{print $1}'); do
            if [[ "$TAG" == "$c"-v* ]]; then echo "component=$c" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "::error::tag $TAG 不匹配任何组件（应为 <component>-v<version>）" >&2
          exit 1

      # 同时校验 tag 版本与包内版本一致，并抽取 CHANGELOG 段落。
      # 校验放在构建里而非只做提示，是为了让「tag 打错 commit」当场失败。
      - name: 构建产物 + 校验版本
        run: python3 tools/release/build.py --component "${{ steps.sel.outputs.component }}" --tag "$TAG"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ steps.sel.outputs.component }}
          path: dist/${{ steps.sel.outputs.component }}/
          retention-days: 7

  # ── 2. PyPI（仅 CLI）────────────────────────────────────────
  publish-pypi:
    needs: build
    if: needs.build.outputs.component == 'agenote'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # trusted publishing：无需在仓库存 API token
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist-${{ needs.build.outputs.component }}
          path: dist

      # 需在 PyPI 后台一次性配置 trusted publisher：
      #   项目 pypi 下的 agenote + 仓 ShineBreaker/agenote + workflow release.yml
      # 未配置时本 job 失败；此时改用 PYPI_API_TOKEN secret 亦可（见 README）。
      # 本 action 把整个目录交给 twine check / attestations.py / twine upload
      # （脚本里写的是 "${PACKAGES_DIR}"/*），目录里任何非发行包文件都会
      # 被当成包解析——dist/ 里还有 SHA256SUMS 与 release_notes.md，
      # 会死于 `Unknown distribution format: 'SHA256SUMS'`。故先清掉它们。
      # 这两个文件已随 dist/ 上传到 artifact，Release 侧不受影响。
      - name: 清掉 dist/ 里的非发行包文件
        run: rm -rf dist/SHA256SUMS dist/release_notes.md

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # ── 3. npm（仅 dsh 插件）────────────────────────────────────
  publish-npm:
    needs: build
    if: needs.build.outputs.component == 'dsh-agenote'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      # --provenance 走 OIDC，需要 id-token；顶层默认只有 contents:write
      id-token: write
    steps:
      # npm --provenance 需要 git 元数据：cwd 无仓库或浅克隆（无 tag）
      # 都会让它误推断包来源，因此拉完整历史与 tags。
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v7
        with:
          name: dist-${{ needs.build.outputs.component }}
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      # 直接 `npm publish dist/*.tgz` 会让 --provenance 去推断包的源仓库：
      # cwd 里没有 package.json，npm 把 tgz 路径当仓库地址去 SSH 探测，
      # 死于 `git@github.com: Permission denied (publickey)`（exit 128）。
      # 先把 tgz 解开、在包目录里发布：那里有 package.json 的 repository
      # 字段，provenance 由此对上本仓，不再瞎猜。
      - name: 解包 tgz 到满足 provenance 的目录
        run: |
          set -euo pipefail
          mkdir -p pkg
          tar xzf dist/*.tgz -C pkg --strip-components=1

      # 需要仓内存 NPM_TOKEN secret。首版只能用 granular token：新包在 npm
      # 上还没有包页，配置不了 trusted publisher（OIDC）。
      # 首版发布后请到包页 Settings → Trusted publishing 配上 GitHub Actions
      # （Organization or user / Repository / Workflow filename = release.yml），
      # 再把下面的 env 去掉（否则 npm 会优先用令牌、静默绕过 OIDC），最后删掉 secret。
      - run: npm publish pkg --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── 4. GitHub Release（全部组件）────────────────────────────
  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist-${{ needs.build.outputs.component }}
          path: dist

      - name: 创建 / 更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # 本 job 不 checkout，gh 必须靠 GH_REPO 定位仓，否则会先跑
          # git 探测并死于 "not a git repository"
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          COMPONENT="${{ needs.build.outputs.component }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "dist/release_notes.md" \
              dist/*
          fi
          echo "::notice::组件 $COMPONENT 发布完成：$TAG"
